name: Release extension

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - lib/**
      - scripts/**
      - background.js
      - content.js
      - content.css
      - popup.html
      - popup.css
      - popup.js
      - icons/**
      - assets/**
      - README.md
      - RELEASE_NOTES.md
      - PRIVACY.md
      - NOTICE.md
      - LICENSE
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and package
        run: |
          npm test
          npm run build
          npm run package

      - name: Verify archive layout
        shell: bash
        run: |
          unzip -Z1 dist/release/youtube-skipper.zip | grep -Fx "manifest.json"
          test -f dist/extension/background.js
          test -f dist/extension/content.js

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or refresh release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Refreshing assets."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "YouTube Skipper $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" \
            dist/release/youtube-skipper.zip \
            "dist/release/youtube-skipper-v${{ steps.version.outputs.version }}.zip" \
            --clobber
